<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A154B" />
      <stop offset="40%" stop-color="#611f69" />
      <stop offset="70%" stop-color="#36C5F0" />
      <stop offset="100%" stop-color="#2EB67D" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0f6fc" />
      <stop offset="100%" stop-color="#36C5F0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ECB22E" />
      <stop offset="50%" stop-color="#E01E5A" />
      <stop offset="100%" stop-color="#36C5F0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(30px, -20px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-25px, 25px); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -100; }
    }
    @keyframes shimmer {
      0% { opacity: 0.3; }
      50% { opacity: 0.9; }
      100% { opacity: 0.3; }
    }
    .orb-1 {
      animation: floatOrb1 9s ease-in-out infinite;
      transform-origin: center;
    }
    .orb-2 {
      animation: floatOrb2 11s ease-in-out infinite;
      transform-origin: center;
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      opacity: 0.35;
    }
    .circuit-path {
      stroke: url(#accentGrad);
      stroke-width: 2;
      stroke-dasharray: 6 12;
      animation: dashCycle 6s linear infinite;
      fill: none;
      opacity: 0.6;
    }
    .badge-shimmer {
      animation: shimmer 3.5s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" stroke="#232f48" stroke-width="1.5" />

  <!-- Background Animated Orbs / Glows (Behind Everything) -->
  <g opacity="0.45">
    <circle class="orb-1" cx="180" cy="90" r="140" fill="#4A154B" filter="url(#glow)" />
    <circle class="orb-2" cx="1020" cy="240" r="160" fill="#0d5c75" filter="url(#glow)" />
    <circle cx="600" cy="170" r="90" fill="#1e3a5f" filter="url(#glow)" opacity="0.3" />
  </g>

  <!-- Background Grid Lines -->
  <g>
    <line x1="100" y1="0" x2="100" y2="340" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="340" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="340" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="340" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="340" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="340" class="grid-line" />
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="170" x2="1200" y2="170" class="grid-line" />
    <line x1="0" y1="270" x2="1200" y2="270" class="grid-line" />
  </g>

  <!-- Dynamic Connecting Circuit Paths (Decorative in Background) -->
  <path d="M 50 280 C 220 280, 260 310, 420 310 S 700 290, 850 315 S 1080 300, 1150 290" class="circuit-path" />
  <path d="M 80 50 C 280 40, 450 65, 620 50 S 920 35, 1120 60" class="circuit-path" />

  <!-- Foreground Content: Pill Badge -->
  <g transform="translate(60, 42)">
    <rect width="365" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <circle cx="15" cy="14" r="4.5" fill="#2EB67D" class="badge-shimmer" />
    <text x="28" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">
      CURATED ECOSYSTEM &amp; INTEGRATIONS
    </text>
  </g>

  <!-- Foreground Content: Main Title -->
  <text x="60" y="125" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    Awesome Collaborative CRM In Slack
  </text>

  <!-- Foreground Content: Subtitle & Description -->
  <text x="60" y="165" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
    Curated Hub for Sales Pipeline Workflows, CRM Automation &amp; Deal Collaboration inside Slack
  </text>

  <!-- Foreground Content: Feature Highlights / Tags -->
  <g transform="translate(60, 205)">
    <!-- Tag 1: Slack Native -->
    <g transform="translate(0, 0)">
      <rect width="165" height="36" rx="8" fill="#182234" stroke="#4A154B" stroke-width="1.5" />
      <text x="16" y="23" fill="#ECB22E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">💬 Slack-Native Deals</text>
    </g>
    <!-- Tag 2: Top SaaS -->
    <g transform="translate(180, 0)">
      <rect width="185" height="36" rx="8" fill="#182234" stroke="#36C5F0" stroke-width="1.5" />
      <text x="16" y="23" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🏢 Enterprise &amp; SaaS</text>
    </g>
    <!-- Tag 3: Open-Source -->
    <g transform="translate(380, 0)">
      <rect width="185" height="36" rx="8" fill="#182234" stroke="#2EB67D" stroke-width="1.5" />
      <text x="16" y="23" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⚡ Open-Source Stacks</text>
    </g>
    <!-- Tag 4: Workflow Bots -->
    <g transform="translate(580, 0)">
      <rect width="180" height="36" rx="8" fill="#182234" stroke="#E01E5A" stroke-width="1.5" />
      <text x="16" y="23" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🤖 AI &amp; Workflow Bots</text>
    </g>
  </g>

  <!-- Subtle Bottom Border Accent -->
  <rect x="0" y="334" width="1200" height="6" fill="url(#primaryGrad)" rx="3" />
</svg>
